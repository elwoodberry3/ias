<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentForge wordmark preview</title>
<style>
  body{margin:0;font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;background:#fff;color:#111827;padding:48px 24px}
  .wrap{max-width:640px;margin:0 auto}
  .mark{display:inline-flex;align-items:flex-end;line-height:1;font-size:34px}
  .agent{font-weight:700;text-transform:uppercase;color:#0A2E36;letter-spacing:-.01em}
  .forge{font-weight:400;text-transform:uppercase;color:#3F7266;letter-spacing:-.01em}
  .cursor{display:inline-block;width:.62em;height:.12em;margin-bottom:.06em;margin-left:.14em;background:#00E5A3;border-radius:1px;animation:blink 1.4s steps(1) infinite}
  @keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.25}}
  .divider{border-bottom:1px solid #E5E7EB;padding-bottom:24px;margin-bottom:32px}
  .tag{margin-top:12px;color:#6B7280;font-size:15px;max-width:52ch}
  .label{font-family:'Space Mono',monospace;font-size:11px;color:#9CA3AF;text-transform:uppercase;letter-spacing:.1em;margin-bottom:28px}
  .row{margin:34px 0}
  .cap{font-family:'Space Mono',monospace;font-size:11px;color:#9CA3AF;margin-bottom:8px}
</style></head>
<body><div class="wrap">
  <div class="label">AgentForge wordmark — preview vs wireframe v001</div>

  <div class="divider">
    <span class="mark"><span class="agent">Agent</span><span class="forge">Forge</span><span class="cursor"></span></span>
    <p class="tag">Turn loose plain-English notes into a production-grade CLAUDE.md, delivered to your inbox and ready to open in Claude Code.</p>
  </div>

  <div class="row">
    <div class="cap">at 34px (header size)</div>
    <span class="mark" style="font-size:34px"><span class="agent">Agent</span><span class="forge">Forge</span><span class="cursor"></span></span>
  </div>
  <div class="row">
    <div class="cap">at 48px</div>
    <span class="mark" style="font-size:48px"><span class="agent">Agent</span><span class="forge">Forge</span><span class="cursor"></span></span>
  </div>
  <div class="row">
    <div class="cap">at 22px (compact)</div>
    <span class="mark" style="font-size:22px"><span class="agent">Agent</span><span class="forge">Forge</span><span class="cursor"></span></span>
  </div>
</div></body></html>
